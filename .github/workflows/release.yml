name: Release

# Safe release flow:
# 1. Land this workflow first without VERSION.
# 2. Open a separate `chore(release): prepare vX.Y.Z` PR that adds/bumps VERSION.
# 3. Merging the VERSION PR to main builds/pushes GHCR images, tags, and creates a GitHub Release.
#
# amd64 and arm64 are built on native runners (no QEMU emulation) and merged
# into a single multi-arch manifest. Emulated arm64 Rust builds previously
# overran the 45m job timeout; native builds keep each leg fast.
on:
  push:
    branches: [main]
    paths:
      - VERSION

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: ver
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ -z "$version" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Guard duplicate tag
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; bump VERSION before merging"
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=opsgate-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=opsgate-release-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Resolve executable image manifest
        id: runtime
        env:
          BUILT_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p reports
          docker buildx imagetools inspect "$BUILT_IMAGE" --raw > reports/index.json
          digest=$(jq -er --arg arch "$ARCH" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("Expected one executable image manifest") end' reports/index.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${REGISTRY}/${IMAGE}@${digest}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'index=%s\nplatform=linux/%s\ntarget=%s\n' "$BUILT_IMAGE" "$ARCH" "$image" > reports/target.txt

      - name: Smoke test the executable image
        env:
          RUNTIME_IMAGE: ${{ steps.runtime.outputs.image }}
        run: bash deploy/ci/smoke-runtime.sh "$RUNTIME_IMAGE"

      - name: Scan the executable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ steps.runtime.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: reports/trivy.json
          exit-code: '1'
          timeout: 10m
          cache: false

      - name: Retain runtime security evidence
        if: ${{ always() && steps.runtime.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-security-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify current source and successful main CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          [[ "$current" == "$GITHUB_SHA" ]]
          successful=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100" --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_branch == "main" and .event == "push" and .conclusion == "success")] | length')
          (( successful > 0 ))

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          version="${{ needs.version.outputs.version }}"
          images=()
          for digest in *; do
            images+=("${REGISTRY}/${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE}:${version}" \
            -t "${REGISTRY}/${IMAGE}:latest" \
            "${images[@]}"

      - name: Inspect manifest
        run: |
          version="${{ needs.version.outputs.version }}"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${version}"

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --generate-notes
