name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Format
        run: cargo fmt --all --check

      - name: Diff check
        run: git diff --check

  rust:
    name: Rust
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opsgate
          POSTGRES_PASSWORD: opsgate
          POSTGRES_DB: opsgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsgate -d opsgate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      OPSGATE_TEST_DATABASE_MIGRATE_URL: postgres://opsgate:opsgate@127.0.0.1:5432/opsgate
      OPSGATE_TEST_DATABASE_URL: postgres://opsgate_app:opsgate_app@127.0.0.1:5432/opsgate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
